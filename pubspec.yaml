name: ai_chat
description: AiChat - 角色扮演类微信聊天APP
publish_to: 'none'
version: 1.1.3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  uuid: ^4.2.1
  archive: ^4.0.2
  gbk_codec: ^0.4.0
  image_picker: ^1.0.7
  lpinyin: ^2.0.3
  path_provider: ^2.1.3
  http: ^1.2.0
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.0
  flutter_local_notifications: ^22.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/avatars/
